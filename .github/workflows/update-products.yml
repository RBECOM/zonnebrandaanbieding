name: Update product feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update Plein product selections
        env:
          DAISYCON_FEED_URL: ${{ secrets.DAISYCON_FEED_URL }}
        run: python scripts/update_products.py
      - name: Publish changed prices and products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json *.html
          git diff --cached --quiet || git commit -m "Update Plein product feed"
          git push
